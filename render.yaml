services:
  - type: web
    name: nexus-ai-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        value: https://nexus-ai-lyftr-ai-assignment.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: CACHE_TYPE
        value: local
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "true"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
